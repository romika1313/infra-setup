# Infrastructure deployment pipeline — Bicep → Azure
#
# ── OIDC SETUP (one-time, before this workflow can run) ─────────────────────
#
# Why 3 separate app registrations?
# Each is scoped to its own resource group. The dev runner is physically
# incapable of modifying prod — different identity, different permissions.
#
# ── Step 1: Create 3 app registrations ──────────────────────────────────────
# Azure Portal → Entra ID → App registrations → New registration (repeat 3×):
#
#   Name: expense-hub-infra-dev    (leave redirect URI blank) → Register
#   Name: expense-hub-infra-test
#   Name: expense-hub-infra-prod
#
#   Note each registration's Application (client) ID — you'll need them below.
#   Directory (tenant) ID is the same for all three.
#
# ── Step 2: Add one federated credential to each registration ────────────────
# On each registration → Certificates & secrets → Federated credentials → Add:
#
#   expense-hub-infra-dev:
#     Scenario: GitHub Actions | Org: romika1313 | Repo: infra-setup
#     Entity type: Environment | Environment name: dev | Name: gh-env-dev
#
#   expense-hub-infra-test:  same, Environment name: test | Name: gh-env-test
#   expense-hub-infra-prod:  same, Environment name: prod | Name: gh-env-prod
#
# ── Step 3: Assign Owner on each resource group to its registration ──────────
# The resource groups are created automatically on first pipeline run.
# After the first run creates them, assign roles:
#
#   rgrp-expense-dev-eus2  → IAM → Owner → expense-hub-infra-dev  service principal
#   rgrp-expense-test-eus2 → IAM → Owner → expense-hub-infra-test service principal
#   rgrp-expense-prod-eus2 → IAM → Owner → expense-hub-infra-prod service principal
#
# ── Step 4: GitHub secrets and variables ────────────────────────────────────
#
#   Repo-level secrets (Settings → Secrets → Actions) — same for all envs:
#     AZURE_TENANT_ID       = Directory (tenant) ID (same for all 3 registrations)
#     AZURE_SUBSCRIPTION_ID = 5afac646-8a2a-4662-90df-0d34a9775af8
#
#   Environment secrets — Settings → Environments → [env] → Add secret:
#     dev:   AZURE_CLIENT_ID = client ID of expense-hub-infra-dev
#            SQL_ADMIN_PASSWORD = (generate: openssl rand -base64 18)
#     test:  AZURE_CLIENT_ID = client ID of expense-hub-infra-test
#            SQL_ADMIN_PASSWORD = (separate value)
#     prod:  AZURE_CLIENT_ID = client ID of expense-hub-infra-prod
#            SQL_ADMIN_PASSWORD = (separate value)
#
# ── AFTER FIRST DEPLOY — manual Key Vault secrets ───────────────────────────
# The pipeline auto-populates: storage-connection-string, database-url,
# document-intelligence-key, azure-openai-api-key, azure-maps-key
#
# Add these manually to each Key Vault before the app can start:
#   nextauth-secret        → generate: openssl rand -base64 32
#   azure-ad-client-secret → from the Entra app registration for the expense app
#   ingest-shared-secret   → any random value
#   digest-shared-secret   → any random value
# ────────────────────────────────────────────────────────────────────────────

name: Infrastructure Deploy

on:
  push:
    branches: [main]
    paths:
      - 'bicep/**'
      - '.github/workflows/infra-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bicep/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, test, prod]

permissions:
  id-token: write  # required for OIDC token exchange
  contents: read

jobs:
  # ── Validate: always runs (PR and push) ─────────────────────────────────────
  # What it does: checks Bicep syntax and validates against Azure ARM APIs.
  # What it does NOT do: make any changes to Azure.
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    # Uses the "dev" environment — validate needs Azure auth to call the ARM API.
    # Sharing "dev"'s federated credential avoids a separate "validate" environment.
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure DEV resource group exists
        run: az group create --name rgrp-expense-dev-eus2 --location eastus2 --tags environment=dev application=expense-hub managedBy=bicep

      - name: Validate DEV template
        run: |
          az deployment group validate \
            --resource-group rgrp-expense-dev-eus2 \
            --template-file bicep/main.bicep \
            --parameters bicep/params/dev.bicepparam \
            --parameters sqlAdminPassword="ValidateOnly#1" \
            --output table

  # ── What-If: only on pull requests ──────────────────────────────────────────
  # What it does: shows exactly what Azure WILL change if this PR is merged.
  # This is your review step — read this output before approving the PR.
  what-if:
    name: What-If (DEV)
    runs-on: ubuntu-latest
    environment: dev
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-If against DEV
        run: |
          az deployment group what-if \
            --resource-group rgrp-expense-dev-eus2 \
            --template-file bicep/main.bicep \
            --parameters bicep/params/dev.bicepparam \
            --parameters sqlAdminPassword="WhatIfOnly#1" \
            --result-format FullResourcePayloads

  # ── Deploy DEV: runs on merge to main ────────────────────────────────────────
  # What it does: creates/updates all Azure resources in rgrp-expense-dev-eus2.
  # Runs automatically after PR is merged — no manual approval needed for DEV.
  deploy-dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    environment: dev
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to DEV
        run: |
          SP_OID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          az group create --name rgrp-expense-dev-eus2 --location eastus2 --tags environment=dev application=expense-hub managedBy=bicep
          az deployment group create \
            --resource-group rgrp-expense-dev-eus2 \
            --template-file bicep/main.bicep \
            --parameters bicep/params/dev.bicepparam \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
            --parameters deployingPrincipalId="$SP_OID" \
            --output table

  # ── Deploy TEST: runs after DEV succeeds ─────────────────────────────────────
  deploy-test:
    name: Deploy TEST
    runs-on: ubuntu-latest
    environment: test
    needs: deploy-dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to TEST
        run: |
          SP_OID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          az group create --name rgrp-expense-test-eus2 --location eastus2 --tags environment=test application=expense-hub managedBy=bicep
          az deployment group create \
            --resource-group rgrp-expense-test-eus2 \
            --template-file bicep/main.bicep \
            --parameters bicep/params/test.bicepparam \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
            --parameters deployingPrincipalId="$SP_OID" \
            --output table

  # ── Deploy PROD: requires manual approval ────────────────────────────────────
  # The "prod" GitHub Environment has a Required reviewers protection rule.
  # GitHub will pause here and send an email to the reviewers before proceeding.
  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    environment: prod
    needs: deploy-test
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to PROD
        run: |
          SP_OID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          az group create --name rgrp-expense-prod-eus2 --location eastus2 --tags environment=prod application=expense-hub managedBy=bicep
          az deployment group create \
            --resource-group rgrp-expense-prod-eus2 \
            --template-file bicep/main.bicep \
            --parameters bicep/params/prod.bicepparam \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
            --parameters deployingPrincipalId="$SP_OID" \
            --output table
