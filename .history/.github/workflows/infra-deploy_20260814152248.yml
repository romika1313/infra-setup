# Infrastructure deployment pipeline — Bicep → Azure
#
# ── OIDC SETUP (one-time, before this workflow can run) ─────────────────────
# 1. In Azure Portal → Entra ID → App registrations → New registration
#    Name: "expense-infra-github-actions"
#    Leave redirect URI blank → Register
#
# 2. Note the Application (client) ID and Directory (tenant) ID.
#
# 3. On the app registration → Certificates & secrets → Federated credentials
#    This is ONE app registration. Add THREE federated credential entries inside it —
#    each entry is a trust rule for one GitHub environment.
#
#    | Federated credential name | GitHub environment | Subject token GitHub sends        |
#    |---------------------------|--------------------|-----------------------------------|
#    | gh-env-dev                | dev                | ...environment:dev                |
#    | gh-env-test               | test               | ...environment:test               |
#    | gh-env-prod               | prod               | ...environment:prod               |
#
#    Validate and what-if jobs share the "dev" environment — no 4th credential needed.
#
# 4. In Azure Portal → Subscriptions → 5afac646-... → Access control (IAM)
#    Add role assignment:
#      Role: Owner   (needed to create RBAC assignments inside Bicep)
#      Assign to: the app registration service principal
#
# 5. In GitHub → romika1313/infra-setup → Settings → Environments
#    Create: validate, dev, test, prod
#    On "prod" environment: add a Required reviewers protection rule (approval gate)
#
# 6. In GitHub → Settings → Secrets and variables → Actions → Secrets
#
#    ── Federated identity (OIDC) — NO client secret is stored ──────────────
#    GitHub proves its identity to Azure using a short-lived token, not a
#    password. Azure trusts it because of the federated credentials in step 3.
#    These three values identify WHERE the token comes from; they are not secrets.
#
#    AZURE_CLIENT_ID       = Application (client) ID from step 2
#    AZURE_TENANT_ID       = Directory (tenant) ID from step 2
#    AZURE_SUBSCRIPTION_ID = 5afac646-8a2a-4662-90df-0d34a9775af8
#
#    ── SQL passwords (these ARE secrets — generate once, store here) ────────
#    SQL_ADMIN_PASSWORD_DEV  = (generate: openssl rand -base64 18 | tr -dc A-Za-z0-9 | head -c24)
#    SQL_ADMIN_PASSWORD_TEST = (separate value)
#    SQL_ADMIN_PASSWORD_PROD = (separate value)
#
# ── AFTER FIRST DEPLOY — manual Key Vault secrets ───────────────────────────
# The pipeline auto-populates: storage-connection-string, database-url,
# document-intelligence-key, azure-openai-api-key, azure-maps-key
#
# You MUST manually add these to each Key Vault before the app can start:
#   nextauth-secret       → generate: openssl rand -base64 32
#   azure-ad-client-secret → from the Entra app registration for the expense app
#   ingest-shared-secret   → any random value (used to authenticate Power Automate calls)
#   digest-shared-secret   → any random value
# ────────────────────────────────────────────────────────────────────────────

name: Infrastructure Deploy

on:
  push:
    branches: [main]
    paths:
      - 'bicep/**'
      - '.github/workflows/infra-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bicep/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, test, prod]

permissions:
  id-token: write  # required for OIDC token exchange
  contents: read

jobs:
  # ── Validate: always runs (PR and push) ─────────────────────────────────────
  # What it does: checks Bicep syntax and validates against Azure ARM APIs.
  # What it does NOT do: make any changes to Azure.
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    environment: validate
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate DEV template
        run: |
          az deployment sub validate \
            --location eastus2 \
            --template-file bicep/main.bicep \
            --parameters bicep/params/dev.bicepparam \
            --parameters sqlAdminPassword="ValidateOnly#1" \
            --output table

  # ── What-If: only on pull requests ──────────────────────────────────────────
  # What it does: shows exactly what Azure WILL change if this PR is merged.
  # This is your review step — read this output before approving the PR.
  what-if:
    name: What-If (DEV)
    runs-on: ubuntu-latest
    environment: validate
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-If against DEV
        run: |
          az deployment sub what-if \
            --location eastus2 \
            --template-file bicep/main.bicep \
            --parameters bicep/params/dev.bicepparam \
            --parameters sqlAdminPassword="WhatIfOnly#1" \
            --result-format FullResourcePayloads

  # ── Deploy DEV: runs on merge to main ────────────────────────────────────────
  # What it does: creates/updates all Azure resources in rgrp-expense-dev-eus2.
  # Runs automatically after PR is merged — no manual approval needed for DEV.
  deploy-dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    environment: dev
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to DEV
        run: |
          az deployment sub create \
            --location eastus2 \
            --template-file bicep/main.bicep \
            --parameters bicep/params/dev.bicepparam \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD_DEV }}" \
            --output table

  # ── Deploy TEST: runs after DEV succeeds ─────────────────────────────────────
  deploy-test:
    name: Deploy TEST
    runs-on: ubuntu-latest
    environment: test
    needs: deploy-dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to TEST
        run: |
          az deployment sub create \
            --location eastus2 \
            --template-file bicep/main.bicep \
            --parameters bicep/params/test.bicepparam \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD_TEST }}" \
            --output table

  # ── Deploy PROD: requires manual approval ────────────────────────────────────
  # The "prod" GitHub Environment has a Required reviewers protection rule.
  # GitHub will pause here and send an email to the reviewers before proceeding.
  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    environment: prod
    needs: deploy-test
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to PROD
        run: |
          az deployment sub create \
            --location eastus2 \
            --template-file bicep/main.bicep \
            --parameters bicep/params/prod.bicepparam \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD_PROD }}" \
            --output table
